<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101820">
<title>HARCOM Knowledge Engine — Device Test</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#101820;color:#edf4f7}
body{max-width:760px;margin:auto;padding:20px;line-height:1.5}
h1{font-size:1.35rem}p{color:#b9c8d0}
button{padding:12px 16px;margin:5px 5px 5px 0;border:1px solid #9edcf2;border-radius:8px;background:#c9e2eb;color:#14212a;font-weight:700}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1d2a34;border:1px solid #43535e;padding:14px;border-radius:8px;min-height:100px}
.status{padding:10px;border:1px solid #43535e;border-radius:8px}
</style>
</head>
<body>
<h1>HARCOM Offline Knowledge Engine — Device Test</h1>
<p>This is an isolated prototype test page. It writes only to its own isolated test database <strong>harcom-field-knowledge-device-test</strong>. It does not access Tasks, Notes, Mission Logs or backups.</p>
<div class="status" id="status">Checking browser support…</div>
<p>
<button id="run">Run database tests</button>
<button id="inspect">Inspect active library</button>
<button id="search">Search “water”</button>
</p>
<pre id="output">Waiting.</pre>
<script>window.HARCOM_KNOWLEDGE_DB_NAME = "harcom-field-knowledge-device-test";</script>
<script src="../knowledge/crypto.js"></script>
<script src="../knowledge/engine.js"></script>
<script>
(function(){
  "use strict";
  const out=document.getElementById("output");
  const status=document.getElementById("status");
  const log=value=>{out.textContent=typeof value==="string"?value:JSON.stringify(value,null,2);};
  status.textContent=window.indexedDB?"IndexedDB available — prototype can be tested offline.":"IndexedDB unavailable in this browser.";
  const sample=()=>({
    schemaVersion:1,
    releaseId:"device-test-"+Date.now(),
    createdAt:new Date().toISOString(),
    summary:"Small UK-first prototype test package.",
    categories:[{id:"water",title:"Water",description:"Water safety and treatment."}],
    sources:[{id:"dwi-boil-water",title:"Receiving a Boil Water Notice",publisher:"Drinking Water Inspectorate",url:"https://www.dwi.gov.uk/receiving-a-boil-water-notice/"}],
    articles:[{
      id:"water-basics",title:"Water safety basics",summary:"Choosing and treating water safely.",
      body:"Follow the exact notice from the water supplier or local authority. A boil-water notice is different from a do-not-drink or do-not-use notice.",
      steps:["Follow the notice exactly.","If instructed to boil, bring water to a rolling boil before drinking or using it for food preparation.","Cool naturally and store in a clean covered container in the fridge; follow the notice for how long it can be kept."],
      equipment:["Kettle or suitable pan","Clean covered storage container"],
      commonMistakes:["Assuming boiling makes chemically contaminated water safe.","Ignoring a do-not-use notice."],
      dangers:["Boiling water can cause serious scalds.","Boiling does not remove chemical contamination."],
      stopAndGetHelp:"If the notice says do not drink or do not use, use an alternative supply and contact the water supplier or local authority for instructions.",
      contentBasis:"official-guidance",jurisdiction:"UK-wide",
      categoryId:"water",tags:["water","purification","safety"],sourceIds:["dwi-boil-water"],
      reviewedAt:new Date().toISOString(),safetyLevel:"caution"
    }],
    media:[]
  });
  document.getElementById("run").addEventListener("click",async()=>{
    const results=[];
    try{
      const valid=window.HarcomKnowledgeDB.validatePackage(sample());
      results.push({test:"package validation",passed:valid.articles.length===1});
      try{window.HarcomKnowledgeDB.validatePackage({...sample(),schemaVersion:99});results.push({test:"unsupported schema rejection",passed:false});}
      catch(error){results.push({test:"unsupported schema rejection",passed:error.code==="UNSUPPORTED_SCHEMA",code:error.code});}
      try{window.HarcomKnowledgeDB.validatePackage({...sample(),articles:[{...sample().articles[0],sourceIds:["missing"]}]});results.push({test:"missing source rejection",passed:false});}
      catch(error){results.push({test:"missing source rejection",passed:error.code==="MISSING_REFERENCE",code:error.code});}
      const firstPackage=sample();
      const firstId=firstPackage.releaseId;
      const installed=await window.HarcomKnowledgeDB.installRelease(firstPackage);
      results.push({test:"install and activate release",passed:installed.ok,release:installed.release.id});
      const active=await window.HarcomKnowledgeDB.getActiveRelease();
      results.push({test:"active release read-back",passed:!!active&&active.id===firstId});
      const secondPackage=sample();
      secondPackage.releaseId=firstId+"-next";
      const second=await window.HarcomKnowledgeDB.installRelease(secondPackage);
      results.push({test:"second release activates without deleting first",passed:second.ok&&(await window.HarcomKnowledgeDB.getRelease(firstId)).status==="previous"});
      await window.HarcomKnowledgeDB.activateRelease(firstId);
      const rolledBack=await window.HarcomKnowledgeDB.getActiveRelease();
      results.push({test:"rollback to previous release",passed:!!rolledBack&&rolledBack.id===firstId});
      const article=await window.HarcomKnowledgeDB.getArticle("water-basics");
      results.push({test:"article read-back",passed:!!article&&article.title==="Water safety basics"});
      const categories=await window.HarcomKnowledgeDB.listCategories();
      results.push({test:"category read-back",passed:categories.length===1});
      const search=await window.HarcomKnowledgeDB.search("water safety");
      results.push({test:"offline indexed multi-word search",passed:search.length===1&&search[0].id==="water-basics"});
      const noMatch=await window.HarcomKnowledgeDB.search("water unicorn");
      results.push({test:"search requires every query term",passed:noMatch.length===0});
      const signedBytes=new TextEncoder().encode(JSON.stringify(sample()));
      const keyPair=await crypto.subtle.generateKey({name:"Ed25519"},true,["sign","verify"]);
      const publicBytes=new Uint8Array(await crypto.subtle.exportKey("raw",keyPair.publicKey));
      const signatureBytes=new Uint8Array(await crypto.subtle.sign({name:"Ed25519"},keyPair.privateKey,signedBytes));
      const digest=new Uint8Array(await crypto.subtle.digest("SHA-256",signedBytes));
      const toBase64=bytes=>btoa(String.fromCharCode(...bytes));
      const hash=Array.from(digest,value=>value.toString(16).padStart(2,"0")).join("");
      const signedPayload=JSON.parse(new TextDecoder().decode(signedBytes));
      const verified=await window.HarcomKnowledgeCrypto.verifySignedPackage(signedBytes,{format:"HARCOM_KNOWLEDGE_RELEASE",manifestVersion:1,schemaVersion:1,packageSize:signedBytes.byteLength,releaseId:signedPayload.releaseId,createdAt:signedPayload.createdAt,packageUrl:"./knowledge/releases/device-test.json",packageSha256:hash,signature:toBase64(signatureBytes),keyId:"device-ephemeral-test"},toBase64(publicBytes));
      results.push({test:"Ed25519 signature and SHA-256 verification",passed:verified.sha256===hash});
      const status=await window.HarcomKnowledgeDB.storageStatus();
      results.push({test:"storage status",passed:typeof status.supported==="boolean",storage:status});
      log({summary:results.every(item=>item.passed)?"ALL PROTOTYPE CHECKS PASSED":"ONE OR MORE CHECKS FAILED",results});
    }catch(error){results.push({test:"unexpected failure",passed:false,code:error.code||"ERROR",message:error.message});log({summary:"TEST RUN FAILED",results});}
  });
  document.getElementById("inspect").addEventListener("click",async()=>{
    try{log({activeRelease:await window.HarcomKnowledgeDB.getActiveRelease(),categories:await window.HarcomKnowledgeDB.listCategories()});}
    catch(error){log({error:error.message,code:error.code});}
  });
  document.getElementById("search").addEventListener("click",async()=>{
    try{log(await window.HarcomKnowledgeDB.search("water"));}
    catch(error){log({error:error.message,code:error.code});}
  });
})();
</script>
</body>
</html>
