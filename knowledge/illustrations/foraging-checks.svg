<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420"><rect width="720" height="420" rx="24" fill="#14232d"/><text x="36" y="48" fill="#bcecff" font-family="Arial" font-size="24" font-weight="700">FORAGING: CHECK EVERY GATE</text><g font-family="Arial" font-size="17" text-anchor="middle"><rect x="28" y="95" width="155" height="82" rx="14" fill="#223b43" stroke="#8eb6a2" stroke-width="3"/><text x="105" y="128" fill="#edf5f8">1 • IDENTITY</text><text x="105" y="153" fill="#bcecff">certain?</text><rect x="196" y="95" width="155" height="82" rx="14" fill="#223b43" stroke="#8eb6a2" stroke-width="3"/><text x="273" y="128" fill="#edf5f8">2 • PERMISSION</text><text x="273" y="153" fill="#bcecff">allowed?</text><rect x="364" y="95" width="155" height="82" rx="14" fill="#223b43" stroke="#8eb6a2" stroke-width="3"/><text x="441" y="128" fill="#edf5f8">3 • CLEAN SITE</text><text x="441" y="153" fill="#bcecff">unpolluted?</text><rect x="532" y="95" width="160" height="82" rx="14" fill="#223b43" stroke="#8eb6a2" stroke-width="3"/><text x="612" y="128" fill="#edf5f8">4 • SUSTAIN</text><text x="612" y="153" fill="#bcecff">leave plenty?</text></g><path d="M183 136h13m155 0h13m155 0h13" stroke="#f08a36" stroke-width="5"/><rect x="110" y="245" width="500" height="90" rx="18" fill="#3b2525" stroke="#f08a36" stroke-width="3"/><text x="360" y="282" fill="#f08a36" font-family="Arial" font-size="24" font-weight="700" text-anchor="middle">ANY DOUBT? STOP.</text><text x="360" y="312" fill="#edf5f8" font-family="Arial" font-size="17" text-anchor="middle">Leave it. Never taste-test an unknown species.</text></svg>