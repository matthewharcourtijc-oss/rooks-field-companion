name: Nightly Field Companion regression

on:
  schedule:
    - cron: '7 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: companion-nightly-regression
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out active development candidate
        uses: actions/checkout@v4
        with:
          ref: development/offline-knowledge-engine
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated browser and IndexedDB test dependencies
        run: npm install --no-save --no-package-lock fake-indexeddb@6.2.4 playwright@1.56.1
      - name: Validate app and offline knowledge engine
        run: node tests/validate.mjs && node tests/knowledge-engine.mjs && node tests/knowledge-engine-runtime.mjs
      - name: Install headless Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Run browser and offline smoke tests
        run: node tests/knowledge-engine-browser.mjs
